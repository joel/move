# Blast-radius configuration for the self-healing pipeline
# (doc/project/self-healing.md). Consumed by script/self_healing/score.rb,
# which the workflow ALWAYS runs from a checkout of main — never from the PR
# head — so an autofix PR editing this file cannot widen its own blast radius
# (.github/** is itself deny-listed).
#
# Semantics (fail closed): every file changed by an autofix PR must match at
# least one `allow` pattern AND no `deny` pattern, or the PR is hard-gated to
# `autofix:needs-human`. Deny wins over allow. `**` crosses directory
# boundaries; `*` stays within a path segment; `{a,b}` alternates.

deny:
  # Schema/config/infrastructure: the deploy entrypoint runs db:prepare on
  # boot and schema never rolls back on a single-host Kamal setup — an
  # automated migration cannot be safely reverted.
  - db/**
  - config/**
  - .kamal/**
  - Dockerfile
  - bin/**
  # The pipeline's own control plane: workflows, scorer, blast radius, hooks.
  - .github/**
  - script/**
  - .claude/**
  - .git-hooks/**
  - .overcommit.yml
  # Dependency + boundary manifests.
  - Gemfile*
  - package.yml
  - packwerk.yml
  - Steepfile
  - rbs_collection*
  - sig/rbs_rails/** # generated — regenerating belongs to schema/route work
  - vendor/**
  - public/**
  - lib/** # rake tasks, cops, generators — infrastructure, not domain code
  # Auth, tenancy, and authorization surfaces: fragile (passwordless Rodauth +
  # Apartment elevator) and security-critical; a plausible-but-wrong automated
  # change here is an account-takeover class risk, and live auth verification
  # (AGENTS.md §1.3) cannot run in this pipeline.
  - app/misc/**
  - app/policies/**
  - app/mcp/**
  - packs/organizations/**
  - packs/accounts/**
  - packs/session_handoffs/**
  - packs/move_integration_tokens/**
  - packs/move_memberships/**
  # Client-side code: system specs run under rack_test (no JS executes), so a
  # JS/asset regression spec cannot prove anything in CI.
  - app/javascript/**
  - app/assets/**

allow:
  - app/actions/**
  - app/models/**
  - app/controllers/**
  - app/views/**
  - app/components/**
  - app/helpers/**
  - app/jobs/**
  - app/mailers/**
  - app/presenters/**
  - app/pdfs/**
  - app/subscribers/**
  - app/lib/**
  - packs/*/app/**
  - spec/**
  - packs/*/spec/**
  - sig/** # hand-written shims only — sig/rbs_rails/** is denied above

size_limits:
  max_files: 10
  max_non_spec_lines: 200
