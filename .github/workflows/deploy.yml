name: Deploy

run-name: ${{ github.actor }} - DEPLOY - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
  # Manual lever: recover a deploy that a push skipped (e.g. a stray [skip ci]
  # in a squash-merge message suppresses the push-triggered run). Run with
  # `gh workflow run Deploy --ref main` or from the Actions tab.
  workflow_dispatch:

# Never run two production deploys at once. cancel-in-progress is false so an
# in-flight kamal deploy (which holds a server-side lock and may be mid-rollout)
# is never interrupted; a newer push queues and supersedes any other pending run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Allow opting out of a deploy for a given commit.
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"

    env:
      # These are synced into GitHub Actions secrets by Doppler's GitHub
      # integration. This flag tells `.kamal/secrets` to read them from the
      # environment HERE (CI); every local deploy ignores the ambient shell/.env
      # and reads straight from Doppler + config/master.key, so a stale exported
      # value can never shadow the source of truth.
      KAMAL_SECRETS_FROM_ENV: "1"
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      NOTIF_MAIL_USERNAME: ${{ secrets.NOTIF_MAIL_USERNAME }}
      NOTIF_MAIL_PASSWORD: ${{ secrets.NOTIF_MAIL_PASSWORD }}
      # move-app S3 identity for the shared SeaweedFS (Active Storage).
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      # Encrypted DB backups (#536): restic repository URL + encryption password
      # and the R2 bucket-scoped S3 token pair for the `backup` accessory
      # (doc/project/backups.md). A deploy never touches accessories — the
      # accessory reads these from Doppler at a manual boot/reboot — so their
      # presence in the guard below is a sync-integrity alarm: a broken/renamed
      # Doppler→GitHub mapping surfaces at the next deploy, not mid-incident.
      RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Google social sign-in. OPTIONAL — when the Doppler/GitHub secrets are
      # absent these resolve to empty and the Google button/One Tap stay hidden,
      # so they are intentionally NOT in the required-secrets guard below.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # Sentry error monitoring (#528). OPTIONAL — when absent the SDK just
      # stays disabled, so intentionally NOT in the required-secrets guard.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # No OPENAI_API_KEY here: embeddings (#232) and recognition (#185) are both
      # per-Move BYO, so the deploy injects no shared AI key (and it is no longer
      # in Doppler). Its only consumer is the Release Bug Scan workflow, which
      # reads a distinctly named CI-only repo secret (CODEX_OPENAI_API_KEY).

    steps:
      # Fail fast on a missing/empty secret before kamal runs. With
      # KAMAL_SECRETS_FROM_ENV=1, `.kamal/secrets` reads these straight from the
      # environment, so a broken Doppler->GitHub sync (renamed/removed key) would
      # otherwise resolve to an empty string and silently deploy a blank
      # RAILS_MASTER_KEY / POSTGRES_PASSWORD / ... (#200). Guard here, not in the
      # dotenv-parsed secrets file, where a standalone check can't live safely.
      - name: Verify required deploy secrets are present
        run: |
          missing=()
          for s in KAMAL_REGISTRY_PASSWORD RAILS_MASTER_KEY POSTGRES_PASSWORD \
                   NOTIF_MAIL_USERNAME NOTIF_MAIL_PASSWORD STORAGE_ACCESS_KEY_ID \
                   STORAGE_SECRET_ACCESS_KEY RESTIC_REPOSITORY RESTIC_PASSWORD \
                   AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!s}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty deploy secrets: ${missing[*]}. Check the Doppler -> GitHub Actions sync (move/prd)."
            exit 1
          fi
          echo "All required deploy secrets are present."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add deploy host to known_hosts
        # Kamal SSHes to the raw origin IP (servers.web in deploy.yml). Never scan
        # move-easy.org — it is Cloudflare-proxied and does not answer SSH.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 65.20.110.89 >> ~/.ssh/known_hosts

      - name: Deploy
        run: bin/kamal deploy

  # Tell Sentry this release exists, which commits it contains, and that it
  # reached production. Events are ALREADY tagged with release=<git SHA> —
  # Kamal injects KAMAL_VERSION into the container and sentry-ruby's
  # ReleaseDetector picks it up (no app code) — so this job only creates/
  # finalizes the release object and records a production deploy, which is
  # what unlocks regressed-issue detection (`is:regressed`) and suspect
  # commits for the self-healing pipeline (doc/project/self-healing.md).
  #
  # A SEPARATE job, deliberately:
  # - The deploy job's env carries the full production secret set, and a
  #   third-party action must never run in that environment. Here it sees
  #   only the Sentry token + slugs.
  # - `set_commits: auto` needs the full commit history to compute the range
  #   since the previous release; the deploy job's checkout stays shallow.
  # - continue-on-error at the job level: a Sentry hiccup must never mark a
  #   completed deploy red. Missing secrets/vars (not yet provisioned) are a
  #   clean SKIP of the release steps, not a swallowed failure.
  sentry-release:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_RELEASE_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG_SLUG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_SLUG }}
    steps:
      - name: Check Sentry credentials are provisioned
        id: creds
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SENTRY_RELEASE_TOKEN / SENTRY_ORG_SLUG / SENTRY_PROJECT_SLUG not provisioned — skipping release finalization."
          fi

      - name: Checkout (full history for set_commits)
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          # sentry-cli walks the commit range since the previous release;
          # a shallow clone makes commit association fail (Codex P2, #555).
          fetch-depth: 0
          persist-credentials: false

      - name: Finalize Sentry release
        if: steps.creds.outputs.present == 'true'
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        with:
          environment: production
          release: ${{ github.sha }}
          inject: false # Ruby app — no JS sourcemaps to upload or inject
