name: Deploy

run-name: ${{ github.actor }} - DEPLOY - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
  # Manual lever: recover a deploy that a push skipped (e.g. a stray [skip ci]
  # in a squash-merge message suppresses the push-triggered run). Run with
  # `gh workflow run Deploy --ref main` or from the Actions tab.
  workflow_dispatch:

# Never run two production deploys at once. cancel-in-progress is false so an
# in-flight kamal deploy (which holds a server-side lock and may be mid-rollout)
# is never interrupted; a newer push queues and supersedes any other pending run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Allow opting out of a deploy for a given commit.
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"

    env:
      # These are synced into GitHub Actions secrets by Doppler's GitHub
      # integration. This flag tells `.kamal/secrets` to read them from the
      # environment HERE (CI); every local deploy ignores the ambient shell/.env
      # and reads straight from Doppler + config/master.key, so a stale exported
      # value can never shadow the source of truth.
      KAMAL_SECRETS_FROM_ENV: "1"
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      NOTIF_MAIL_USERNAME: ${{ secrets.NOTIF_MAIL_USERNAME }}
      NOTIF_MAIL_PASSWORD: ${{ secrets.NOTIF_MAIL_PASSWORD }}
      # move-app S3 identity for the shared SeaweedFS (Active Storage).
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      # OpenAI key for the *embedding* adapter (D8 hybrid search; EMBEDDING_PROVIDER
      # = openai). Recognition is per-Move BYO (#185) and reads no shared key.
      # Exported here too: the runner has no Doppler CLI, so .kamal/secrets'
      # Doppler fallback would fail the deploy if this weren't in the environment.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      # Fail fast on a missing/empty secret before kamal runs. With
      # KAMAL_SECRETS_FROM_ENV=1, `.kamal/secrets` reads these straight from the
      # environment, so a broken Doppler->GitHub sync (renamed/removed key) would
      # otherwise resolve to an empty string and silently deploy a blank
      # RAILS_MASTER_KEY / POSTGRES_PASSWORD / ... (#200). Guard here, not in the
      # dotenv-parsed secrets file, where a standalone check can't live safely.
      - name: Verify required deploy secrets are present
        run: |
          missing=()
          for s in KAMAL_REGISTRY_PASSWORD RAILS_MASTER_KEY POSTGRES_PASSWORD \
                   NOTIF_MAIL_USERNAME NOTIF_MAIL_PASSWORD STORAGE_ACCESS_KEY_ID \
                   STORAGE_SECRET_ACCESS_KEY OPENAI_API_KEY; do
            [ -n "${!s}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty deploy secrets: ${missing[*]}. Check the Doppler -> GitHub Actions sync (move/prd)."
            exit 1
          fi
          echo "All required deploy secrets are present."

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add deploy host to known_hosts
        # Kamal SSHes to the raw origin IP (servers.web in deploy.yml). Never scan
        # move-easy.org — it is Cloudflare-proxied and does not answer SSH.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 65.20.110.89 >> ~/.ssh/known_hosts

      - name: Deploy
        run: bin/kamal deploy
