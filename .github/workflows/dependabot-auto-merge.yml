name: Dependabot auto-merge

run-name: ${{ github.actor }} - Dependabot Auto Merge - ${{ github.event.pull_request.title }}

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Only run for PRs opened by dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # SHA-pinned: this workflow holds the App private key, and a
      # `pull_request` run executes the merge-ref workflow — floating tags on
      # the actions it runs are a supply-chain channel into that key.
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Auto-merge must be enabled with a GitHub App identity, NOT the default
      # GITHUB_TOKEN: GitHub suppresses workflow runs for events created with
      # GITHUB_TOKEN, so a dependabot PR merged that way lands on main with
      # NEITHER CI nor Deploy running — the gem bump silently never reaches
      # production until the next human push (observed on the merge commits of
      # PRs #470/#471: no run exists for their merge SHAs). The merge push is
      # attributed to the actor that enabled auto-merge, so enabling it with
      # the `move-autofix` App token makes the eventual merge trigger CI-on-main
      # and the production deploy like any human merge.
      #
      # NOTE: this workflow runs on dependabot-triggered `pull_request` events,
      # which read from the *Dependabot* secrets store — the App credentials
      # must be registered under Settings → Secrets and variables → Dependabot
      # (in addition to Actions secrets, where the self-healing pipeline reads
      # them). A missing secret fails this job loudly; auto-merge is then
      # simply not enabled (fail closed).
      # github-actions-ecosystem PRs are EXCLUDED from the privileged path
      # (Codex P1, #554): such a PR edits `.github/workflows/*.yml` pins, and
      # the pull_request run executes the PR-modified workflow — so the very
      # action versions being bumped would run in a job holding the App key
      # before any review. Those (rare) bumps wait for a human merge instead.
      # (`startsWith` rather than an exact match: the metadata action has
      # reported both `github-actions` and `github_actions` across versions;
      # no other ecosystem starts with `github`.)
      - name: Mint GitHub App token
        id: app-token
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          !startsWith(steps.metadata.outputs.package-ecosystem, 'github')
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for Dependabot PRs
        # Only merge patch/minor updates to stay safe
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          !startsWith(steps.metadata.outputs.package-ecosystem, 'github')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
