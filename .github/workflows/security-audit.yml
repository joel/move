name: Security Audit

run-name: Security Audit - ${{ github.event_name }}

# Adversarial, whole-codebase security audit. This repo is open source, so we run
# our own attacker-mindset scan of the entire working tree on a schedule (and on
# demand) — the periodic counterpart to the per-change `/security-review` pass
# (`/execution-plan` Step 5d). It is NON-BLOCKING: it never gates a merge; it opens
# a `security`-labelled issue when it finds something. Threat model lives in
# `doc/project/security-model.md`; the prompt anchors to it + the review rubric.
#
# Requires the CODEX_OPENAI_API_KEY repository secret (the same CI-only credential
# used by Release Bug Scan — deliberately NOT `OPENAI_API_KEY`, which the
# Doppler→GitHub sync manages; see release-bug-scan.yml for the rationale).
on:
  schedule:
    # Mondays 06:00 UTC. Scheduled runs use the default branch (main) only.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege: read the code, and open issues for findings.
permissions:
  contents: read
  issues: write

# Run JS actions on Node 24 (openai/codex-action@v1 pins an older setup-node that
# still targets the deprecated Node 20 runtime; this opts it into Node 24).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One audit at a time; a newer run supersedes an in-flight one.
concurrency:
  group: security-audit-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Don't persist the job's GITHUB_TOKEN (which has issues: write) into
          # .git/config — the read-only Codex audit step scans the whole repo, and
          # the issue-creation step supplies GH_TOKEN explicitly, so authenticated
          # git is never needed after checkout.
          persist-credentials: false

      - name: Run Codex security audit
        id: scan
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          # Read-only: the audit analyses code, it never edits the working tree.
          sandbox: read-only
          prompt-file: .github/codex/security-audit-prompt.md
          output-file: security-audit.md

      # CRITICAL: this is a PUBLIC, open-source repo. The full report contains
      # exploit details (attack steps, impact, file:line). It must NEVER reach a
      # public sink — issue body, job summary, artifact, or logs are all
      # world-readable here. So: classify first; on findings, publish ONLY a
      # redacted notice (count + overall risk) and withhold the detail entirely.
      - name: Triage report
        id: triage
        if: always()
        run: |
          # FAIL CLOSED: a non-empty report is treated as `clean` ONLY when it
          # carries an explicit CLEAN marker. A FINDINGS marker — or any malformed /
          # missing / unknown status on a non-empty report — falls through to
          # `findings` and is redacted, so a report whose marker drifted can never
          # be published in full to a public sink.
          if [ ! -s security-audit.md ]; then
            echo "status=none" >> "$GITHUB_OUTPUT"
          elif grep -q 'SECURITY_AUDIT_STATUS: CLEAN' security-audit.md; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=findings" >> "$GITHUB_OUTPUT"
          fi

      # CLEAN only — a clean report carries no exploit detail, so it is safe to
      # publish in full to the (public) summary + artifact.
      - name: Publish clean report
        if: always() && steps.triage.outputs.status == 'clean'
        run: cat security-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clean report artifact
        if: always() && steps.triage.outputs.status == 'clean'
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-${{ github.run_id }}
          path: security-audit.md
          if-no-files-found: ignore

      - name: No report produced
        if: always() && steps.triage.outputs.status == 'none'
        run: |
          {
            echo "## 🛡️ Security Audit"
            echo "_No report was produced — check the Codex step logs above._"
          } >> "$GITHUB_STEP_SUMMARY"

      # FINDINGS — redact. Derive a non-actionable summary (finding count + overall
      # risk only), publish that to the summary, open a redacted `security` issue,
      # and fail the run so it is noticed. The detailed report (attack/impact/paths)
      # is intentionally NOT published anywhere public; a maintainer reproduces it
      # privately by re-running `/security-review` or this audit locally.
      - name: Handle findings (redacted — no public disclosure)
        if: always() && steps.triage.outputs.status == 'findings'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          count="$(grep -cE '^#### [0-9]+\.' security-audit.md || true)"
          overall="$(grep -m1 -E 'Overall risk:' security-audit.md \
            | sed -E 's/\*\*//g; s/.*Overall risk:[[:space:]]*//; s/[[:space:]]*—.*//' \
            | cut -c1-40)"
          {
            echo "## 🛡️ Security Audit — findings present (details withheld)"
            echo
            echo "**Findings:** ${count:-?} · **Overall risk:** ${overall:-unknown}"
            echo
            echo "Exploit details (attack steps, impact, file:line) are **intentionally"
            echo "withheld** from public sinks on this open-source repo. Maintainers:"
            echo "re-run \`/security-review\` or this audit locally to view the full"
            echo "report, or wire a private channel (tracked follow-up)."
          } | tee redacted.md >> "$GITHUB_STEP_SUMMARY"
          gh label create security \
            --color B60205 \
            --description "Security finding (from the Security Audit workflow or a security review)" \
            2>/dev/null || true
          date_str="$(date -u +%Y-%m-%d)"
          gh issue create \
            --title "Security audit: ${count:-?} finding(s) — ${date_str}" \
            --label security \
            --body-file redacted.md
          # Fail the run (after filing the redacted issue) so the red ❌ is noticed.
          exit 1
