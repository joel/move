name: Security Audit

run-name: Security Audit - ${{ github.event_name }}

# Adversarial, whole-codebase security audit. This repo is open source, so we run
# our own attacker-mindset scan of the entire working tree on a schedule (and on
# demand) — the periodic counterpart to the per-change `/security-review` pass
# (`/execution-plan` Step 5d). It is NON-BLOCKING: it never gates a merge; it opens
# a `security`-labelled issue when it finds something. Threat model lives in
# `doc/project/security-model.md`; the prompt anchors to it + the review rubric.
#
# Requires the CODEX_OPENAI_API_KEY repository secret (the same CI-only credential
# used by Release Bug Scan — deliberately NOT `OPENAI_API_KEY`, which the
# Doppler→GitHub sync manages; see release-bug-scan.yml for the rationale).
on:
  schedule:
    # Mondays 06:00 UTC. Scheduled runs use the default branch (main) only.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege: read the code, and open issues for findings.
permissions:
  contents: read
  issues: write

# Run JS actions on Node 24 (openai/codex-action@v1 pins an older setup-node that
# still targets the deprecated Node 20 runtime; this opts it into Node 24).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One audit at a time; a newer run supersedes an in-flight one.
concurrency:
  group: security-audit-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Don't persist the job's GITHUB_TOKEN (which has issues: write) into
          # .git/config — the read-only Codex audit step scans the whole repo, and
          # the issue-creation step supplies GH_TOKEN explicitly, so authenticated
          # git is never needed after checkout.
          persist-credentials: false

      - name: Run Codex security audit
        id: scan
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          # Read-only: the audit analyses code, it never edits the working tree.
          sandbox: read-only
          prompt-file: .github/codex/security-audit-prompt.md
          output-file: security-audit.md

      # The report is NON-SENSITIVE BY CONSTRUCTION: the prompt forbids file paths,
      # line numbers, code, attack steps, or impact specifics, because the runner
      # echoes Codex output to the world-readable public Actions log (which no
      # post-step can redact). So the report is only severity + generic, non-locating
      # titles — safe to publish to summary/artifact/issue. Detailed, actionable
      # analysis is the job of the per-change `/security-review` pass (Step 5d) and a
      # maintainer's local audit re-run, never this CI report.
      - name: Triage report
        id: triage
        if: always()
        run: |
          # FAIL CLOSED: `clean` ONLY when line 1 is exactly the CLEAN marker. A
          # FINDINGS marker — or any missing/malformed/unknown status on a non-empty
          # report — is treated as `findings` (opens an issue + fails the run).
          # grep -x on line 1 avoids matching the marker text quoted elsewhere.
          if [ ! -s security-audit.md ]; then
            echo "status=none" >> "$GITHUB_OUTPUT"
          elif head -n 1 security-audit.md | grep -qx 'SECURITY_AUDIT_STATUS: CLEAN'; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=findings" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish report to job summary
        if: always() && steps.triage.outputs.status != 'none'
        run: cat security-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always() && steps.triage.outputs.status != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-${{ github.run_id }}
          path: security-audit.md
          if-no-files-found: ignore

      - name: No report produced
        if: always() && steps.triage.outputs.status == 'none'
        run: |
          {
            echo "## 🛡️ Security Audit"
            echo "_No report was produced — check the Codex step logs above._"
          } >> "$GITHUB_STEP_SUMMARY"

      # FINDINGS — open a `security` issue with the (non-sensitive) summary report and
      # fail the run so the red ❌ is noticed. Triage is investigated with a local
      # `/security-review`, where the actionable detail lives.
      - name: Open issue on findings
        if: always() && steps.triage.outputs.status == 'findings'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create security \
            --color B60205 \
            --description "Security finding (from the Security Audit workflow or a security review)" \
            2>/dev/null || true
          date_str="$(date -u +%Y-%m-%d)"
          gh issue create \
            --title "Security audit findings — ${date_str}" \
            --label security \
            --body-file security-audit.md
          # Fail the run (after filing the issue) so the red ❌ is noticed.
          exit 1
