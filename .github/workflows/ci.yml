name: CI

run-name: ${{ github.actor }} - CI - ${{ github.event.pull_request.title || github.event.head_commit.message }}

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'doc/**'

env:
  RAILS_ENV: test
  RAILS_LOG_LEVEL: error

jobs:

  test:

    runs-on: ubuntu-latest

    needs: lint

    services:
      postgres:
        # Must match the dev/prod server (and the pg_dump that produced
        # db/structure.sql): the dump uses PG 17+ GUCs like transaction_timeout.
        # pgvector/pgvector:pg18 = postgres:18 + the `vector` extension (D8).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      -
        name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: '1'
      -
        name: Install Ruby
        uses: ruby/setup-ruby@v1
      -
        # ruby-vips dlopens libvips.so.42 at runtime; ImageNormalizer transcodes
        # uploads (HEIC/TIFF/AVIF/… -> JPEG). The bare runner has no libvips, so
        # the image_normalizer/captures specs need it (mirrors the Dockerfile).
        # The libheif HEVC (libde265) + AV1 (aomdec) plugins let the real-HEIC /
        # real-AVIF decode specs run rather than skip.
        name: "Install libvips + HEIF decoders"
        run: |
          sudo apt-get update
          # Noble (current ubuntu-latest) renamed libvips42 -> libvips42t64 in the
          # t64 transition. Prefer the real name; fall back to libvips42 for
          # runner images that still use it.
          decoders="libheif1 libheif-plugin-libde265 libheif-plugin-aomdec"
          sudo apt-get install -y --no-install-recommends libvips42t64 $decoders \
            || sudo apt-get install -y --no-install-recommends libvips42 $decoders
      -
        name: "Install Dependencies"
        run: bundle install --jobs 4 --retry 3
      -
        name: "Prepare Tests"
        run: |
          bin/rails db:create db:schema:load
          bin/rails assets:precompile
      -
        name: "Test / Unit Tests (controllers, models, helpers, mailers, jobs, lib, requests)"
        run: bundle exec rspec spec --exclude-pattern "spec/system/**/*_spec.rb"
      -
        name: "Test / System Tests"
        run: TEST_BROWSER=rack_test bundle exec rspec spec/system

  lint:

    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          fetch-depth: '1'
      -
        name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      -
        name: "Lint / rubocop"
        run: |
          gem install rubocop
          gem install rubocop-performance
          gem install rubocop-rake
          gem install rubocop-rspec
          gem install rubocop-rspec_rails
          gem install rubocop-rails
          gem install rubocop-capybara
          gem install rubocop-factory_bot
          rubocop --parallel
      -
        name: "Lint / erb_lint"
        run: bin/erb_lint --lint-all
      -
        name: "Security / brakeman"
        run: |
          gem install brakeman
          brakeman --exit-on-warn --no-progress --color --output /dev/stdout
      -
        name: "Security / bundle-audit"
        run: |
          gem install bundle-audit
          bundle-audit check --update -v
