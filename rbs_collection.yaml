# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

gems:
  # Broken/duplicated sigs shipped inside the gem itself — crashes RBS's
  # environment load (DuplicatedDeclarationError), which deadlocks Steep's
  # workers. Transitive dep (omniauth → oauth2 → snaky_hash); irrelevant to our
  # checked scope.
  - name: snaky_hash
    ignore: true
  # activestorage's community sigs (7.0) stay ENABLED: the rbs_rails-generated
  # Media/LabelPrintRun sigs reference ActiveStorage::Attached::One /
  # ::Attachment (has_one_attached), and the generated AS model sigs supply the
  # ActiveRecord query surface the community sigs lack. One community over-
  # strictness (`find_signed!(purpose: Symbol)` vs Rails accepting String) is
  # suppressed at its single call site with a `steep:ignore` comment.
