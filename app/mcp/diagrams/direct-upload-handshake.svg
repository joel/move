<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg{fill:#2A2822}
    .card{fill:#34312A;stroke:#ffffff14;stroke-width:1}
    .accent{fill:#34312A;stroke:#9FB089;stroke-width:1.6}
    .chip{fill:#2b2924;stroke:#ffffff14;stroke-width:1}
    .res{fill:#2f3a2a;stroke:#9FB089;stroke-width:1.4}
    .t{fill:#ECE7DC}
    .sub{fill:#aeb2a6}
    .sage{fill:#9FB089}
    .terra{fill:#ffb59b}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .edge{stroke:#9FB089;stroke-width:2;fill:none}
    .num{fill:#9FB089;font-weight:700}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9FB089"/></marker>
  </defs>

  <rect class="bg" width="1120" height="520"/>
  <text class="t" x="36" y="42" font-size="22" font-weight="700">The Direct Upload handshake</text>
  <text class="sub" x="36" y="66" font-size="13">Image bytes never transit the JSON-RPC body — app-proxied (SeaweedFS is internal-only), in three legs (#110).</text>

  <!-- Leg 1 -->
  <circle cx="40" cy="148" r="14" fill="#2f3a2a" stroke="#9FB089"/>
  <text class="num" x="40" y="153" font-size="14" text-anchor="middle">1</text>
  <rect class="chip" x="68" y="110" width="160" height="78" rx="12"/>
  <text class="t" x="148" y="142" font-size="12.5" font-weight="700" text-anchor="middle">MCP client</text>
  <text class="sub mono" x="148" y="162" font-size="10" text-anchor="middle">create_media_upload</text>
  <rect class="accent" x="300" y="110" width="300" height="78" rx="12"/>
  <text class="sage mono" x="318" y="136" font-size="12.5" font-weight="700">create_media_upload</text>
  <text class="sub" x="318" y="156" font-size="10.5">no action — early size check (declared bytes)</text>
  <text class="sub" x="318" y="173" font-size="10.5">archived Move ⇒ read-only failure</text>
  <rect class="res" x="672" y="110" width="412" height="78" rx="12"/>
  <text class="sage" x="690" y="136" font-size="12" font-weight="700">returns →</text>
  <text class="t mono" x="690" y="158" font-size="10.5">{ url: "&lt;host&gt;/mcp/uploads", method: "POST",</text>
  <text class="t mono" x="690" y="175" font-size="10.5">  headers, instructions: "PUT bytes + same Bearer" }</text>

  <!-- Leg 2 -->
  <circle cx="40" cy="278" r="14" fill="#2f3a2a" stroke="#9FB089"/>
  <text class="num" x="40" y="283" font-size="14" text-anchor="middle">2</text>
  <rect class="chip" x="68" y="240" width="160" height="78" rx="12"/>
  <text class="t" x="148" y="268" font-size="12.5" font-weight="700" text-anchor="middle">MCP client</text>
  <text class="sub mono" x="148" y="288" font-size="9.5" text-anchor="middle">POST raw bytes</text>
  <text class="sub mono" x="148" y="303" font-size="9.5" text-anchor="middle">+ Bearer mcp_…</text>
  <rect class="accent" x="300" y="240" width="300" height="78" rx="12"/>
  <text class="sage mono" x="318" y="266" font-size="12.5" font-weight="700">POST /mcp/uploads</text>
  <text class="sub" x="318" y="286" font-size="10.5">McpUploadsController · ≤ 25 MB (read MAX+1)</text>
  <text class="sub" x="318" y="303" font-size="10.5">sniff magic bytes → image/* only (#139)</text>
  <rect class="res" x="672" y="240" width="412" height="78" rx="12"/>
  <text class="sage" x="690" y="266" font-size="12" font-weight="700">returns →</text>
  <text class="t mono" x="690" y="288" font-size="10.5">{ signed_id }  — Active Storage blob,</text>
  <text class="sub" x="690" y="305" font-size="10.5">scoped to this Move (Captures::Create purpose)</text>

  <!-- Leg 3 -->
  <circle cx="40" cy="408" r="14" fill="#2f3a2a" stroke="#9FB089"/>
  <text class="num" x="40" y="413" font-size="14" text-anchor="middle">3</text>
  <rect class="chip" x="68" y="370" width="160" height="78" rx="12"/>
  <text class="t" x="148" y="398" font-size="12.5" font-weight="700" text-anchor="middle">MCP client</text>
  <text class="sub mono" x="148" y="418" font-size="9" text-anchor="middle">add_media_to_box(</text>
  <text class="sub mono" x="148" y="431" font-size="9" text-anchor="middle">box_number, signed_id)</text>
  <rect class="accent" x="300" y="370" width="300" height="78" rx="12"/>
  <text class="sage mono" x="318" y="396" font-size="12.5" font-weight="700">add_media_to_box</text>
  <text class="sub" x="318" y="416" font-size="10.5">→ Captures::Create (sniff · transcode · attach)</text>
  <text class="sub" x="318" y="433" font-size="10.5">blocks a sealed / archived Move</text>
  <rect class="res" x="672" y="370" width="412" height="78" rx="12"/>
  <text class="sage" x="690" y="396" font-size="12" font-weight="700">media attached · recognition queued</text>
  <text class="sub mono" x="690" y="418" font-size="10.5">audit("mcp.tool_called", media_id:)</text>
  <text class="sub" x="690" y="435" font-size="10.5">→ RecognitionRuns::Enqueue (Solid Queue)</text>

  <!-- arrows -->
  <path class="edge" d="M228,149 H298" marker-end="url(#a)"/>
  <path class="edge" d="M600,149 H670" marker-end="url(#a)"/>
  <path class="edge" d="M228,279 H298" marker-end="url(#a)"/>
  <path class="edge" d="M600,279 H670" marker-end="url(#a)"/>
  <path class="edge" d="M228,409 H298" marker-end="url(#a)"/>
  <path class="edge" d="M600,409 H670" marker-end="url(#a)"/>

  <text class="sub" x="36" y="494" font-size="11.5">The same <tspan class="mono">Authorization: Bearer</tspan> token authenticates both the JSON-RPC session and the upload POST; the <tspan class="mono">signed_id</tspan> is Move-scoped so only this token can attach it.</text>
</svg>
