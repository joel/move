<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg{fill:#2A2822}
    .card{fill:#34312A;stroke:#ffffff14;stroke-width:1}
    .t{fill:#ECE7DC}
    .sub{fill:#aeb2a6}
    .sage{fill:#9FB089}
    .cyan{fill:#8db8c4}
    .terra{fill:#ffb59b}
    .pink{fill:#e5bbcf}
    .gold{fill:#e0c878}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .ev{fill:#d7d2c7}
    .hd{fill:#9FB089;font-weight:700}
  </style>
  <rect class="bg" width="1160" height="720"/>
  <text class="t" x="36" y="42" font-size="22" font-weight="700">Event catalog — who emits, who listens</text>
  <text class="sub" x="36" y="66" font-size="13">~40 <tspan class="mono">domain.verb</tspan> events. Tags show which subscriber consumes each (full payloads in the README table).</text>

  <!-- legend -->
  <g font-size="12">
    <circle cx="44" cy="88" r="5" class="sage"/><text class="sub" x="54" y="92">A — Activity feed</text>
    <circle cx="190" cy="88" r="5" class="cyan"/><text class="sub" x="200" y="92">S — Search reindex</text>
    <circle cx="338" cy="88" r="5" class="terra"/><text class="sub" x="348" y="92">M — Manifest audit</text>
    <circle cx="486" cy="88" r="5" class="pink"/><text class="sub" x="496" y="92">X — MCP audit</text>
    <circle cx="600" cy="88" r="5" class="gold"/><text class="sub" x="610" y="92">P — Variant prewarm</text>
    <text class="sub" x="760" y="92">— — no subscriber (state / advisory only)</text>
  </g>

  <!-- ================= COLUMN 1 ================= -->
  <!-- boxes -->
  <rect class="card" x="36" y="112" width="350" height="158" rx="12"/>
  <text class="hd mono" x="54" y="138" font-size="13">boxes.*</text>
  <g font-size="12" class="mono">
    <text class="ev" x="54" y="160">created <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="180">updated <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="200">status_changed <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="220">deleted <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="240">restored <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="260">description_suggested <tspan class="sub">—</tspan></text>
  </g>
  <!-- items -->
  <rect class="card" x="36" y="288" width="350" height="178" rx="12"/>
  <text class="hd mono" x="54" y="314" font-size="13">items.*</text>
  <g font-size="12" class="mono">
    <text class="ev" x="54" y="336">created <tspan class="sage">A</tspan> <tspan class="cyan">S</tspan></text>
    <text class="ev" x="54" y="356">updated <tspan class="sage">A</tspan> <tspan class="cyan">S</tspan></text>
    <text class="ev" x="54" y="376">moved <tspan class="sage">A</tspan> <tspan class="cyan">S</tspan></text>
    <text class="ev" x="54" y="396">removed <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="416">deleted <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="436">restored <tspan class="sage">A</tspan></text>
    <text class="ev" x="54" y="456">undeleted <tspan class="sage">A</tspan></text>
  </g>

  <!-- ================= COLUMN 2 ================= -->
  <!-- moves -->
  <rect class="card" x="406" y="112" width="350" height="178" rx="12"/>
  <text class="hd mono" x="424" y="138" font-size="13">moves.*</text>
  <g font-size="12" class="mono">
    <text class="ev" x="424" y="160">created <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="180">unit_system_changed <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="200">auto_confirm_threshold_changed <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="220">recognition_provider_changed <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="240">recognition_model_changed <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="260">recognition_key_removed <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="280">summary_viewed <tspan class="sage">A</tspan></text>
  </g>
  <!-- recognition_run -->
  <rect class="card" x="406" y="308" width="350" height="120" rx="12"/>
  <text class="hd mono" x="424" y="334" font-size="13">recognition_run.*</text>
  <g font-size="12" class="mono">
    <text class="ev" x="424" y="356">queued <tspan class="sub">—</tspan></text>
    <text class="ev" x="424" y="376">processing <tspan class="sub">—</tspan></text>
    <text class="ev" x="424" y="396">succeeded <tspan class="sub">—</tspan></text>
    <text class="ev" x="424" y="416">failed <tspan class="sub">—</tspan></text>
  </g>
  <!-- vocabulary -->
  <rect class="card" x="406" y="446" width="350" height="100" rx="12"/>
  <text class="hd mono" x="424" y="472" font-size="13">vocabulary.*</text>
  <g font-size="12" class="mono">
    <text class="ev" x="424" y="494">created <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="514">updated <tspan class="sage">A</tspan></text>
    <text class="ev" x="424" y="534">removed <tspan class="sage">A</tspan></text>
  </g>

  <!-- ================= COLUMN 3 ================= -->
  <!-- move_membership -->
  <rect class="card" x="776" y="112" width="348" height="100" rx="12"/>
  <text class="hd mono" x="794" y="138" font-size="13">move_membership.*</text>
  <g font-size="12" class="mono">
    <text class="ev" x="794" y="160">added <tspan class="sage">A</tspan></text>
    <text class="ev" x="794" y="180">role_changed <tspan class="sage">A</tspan></text>
    <text class="ev" x="794" y="200">removed <tspan class="sage">A</tspan></text>
  </g>
  <!-- integration_token -->
  <rect class="card" x="776" y="230" width="348" height="80" rx="12"/>
  <text class="hd mono" x="794" y="256" font-size="13">integration_token.*</text>
  <g font-size="12" class="mono">
    <text class="ev" x="794" y="278">created <tspan class="sage">A</tspan> <tspan class="pink">X</tspan></text>
    <text class="ev" x="794" y="298">revoked <tspan class="sage">A</tspan> <tspan class="pink">X</tspan></text>
  </g>
  <!-- singles -->
  <rect class="card" x="776" y="328" width="348" height="62" rx="12"/>
  <text class="hd mono" x="794" y="354" font-size="13">manifest.* <tspan class="ev" font-weight="400" font-size="12">viewed <tspan class="sage">A</tspan> <tspan class="terra">M</tspan></tspan></text>
  <text class="sub" x="794" y="376" font-size="11">authenticated sensitive-read audit</text>

  <rect class="card" x="776" y="408" width="348" height="62" rx="12"/>
  <text class="hd mono" x="794" y="434" font-size="13">qr.* <tspan class="ev" font-weight="400" font-size="12">resolved <tspan class="sage">A</tspan></tspan> &#160;&#160; media.* <tspan class="ev" font-weight="400" font-size="12">captured <tspan class="sage">A</tspan> <tspan class="gold">P</tspan></tspan></text>
  <text class="sub" x="794" y="456" font-size="11">qr / summary / manifest are low-signal (filtered)</text>

  <rect class="card" x="776" y="488" width="348" height="58" rx="12"/>
  <text class="hd mono" x="794" y="514" font-size="13">mcp.* <tspan class="ev" font-weight="400" font-size="12">tool_called <tspan class="pink">X</tspan></tspan></text>
  <text class="sub" x="794" y="534" font-size="11">emitted by the MCP assistant tool dispatch</text>

  <!-- subscriber footer -->
  <rect class="card" x="36" y="582" width="1088" height="112" rx="12"/>
  <text class="t" x="54" y="608" font-size="13" font-weight="700">Subscribers (config/initializers/*)</text>
  <g font-size="12">
    <text class="ev" x="54" y="634"><tspan class="sage" font-weight="700">A</tspan>  Activity::RecordSubscriber — filter <tspan class="mono">Builder.records?</tspan> → append-only feed row</text>
    <text class="ev" x="54" y="654"><tspan class="cyan" font-weight="700">S</tspan>  Search::IndexSubscriber — filter <tspan class="mono">item.*</tspan> → RefreshDocumentJob (async)</text>
    <text class="ev" x="54" y="674"><tspan class="gold" font-weight="700">P</tspan>  MediaVariants::PrewarmSubscriber — filter <tspan class="mono">media.captured</tspan> → PrewarmJob (async)</text>
    <text class="ev" x="600" y="634"><tspan class="terra" font-weight="700">M</tspan>  Manifests::AuditSubscriber — filter <tspan class="mono">manifest.*</tspan> → audit log</text>
    <text class="ev" x="600" y="654"><tspan class="pink" font-weight="700">X</tspan>  MoveMcp::AuditSubscriber — filter <tspan class="mono">integration_token. / mcp.</tspan></text>
  </g>
</svg>
