<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg{fill:#2A2822}
    .card{fill:#34312A;stroke:#ffffff14;stroke-width:1}
    .accent{fill:#34312A;stroke:#9FB089;stroke-width:1.6}
    .bus{fill:#2f3a2a;stroke:#9FB089;stroke-width:1.6}
    .async{fill:#34312A;stroke:#ffb59b;stroke-width:1.4}
    .t{fill:#ECE7DC}
    .sub{fill:#aeb2a6}
    .sage{fill:#9FB089}
    .terra{fill:#ffb59b}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .edge{stroke:#9FB089;stroke-width:2;fill:none}
    .pill{fill:#2f3a2a;stroke:#9FB089;stroke-width:1.4}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9FB089"/></marker>
  </defs>

  <rect class="bg" width="1160" height="520"/>
  <text class="t" x="36" y="42" font-size="22" font-weight="700">Worked example — add an item by hand</text>
  <text class="sub" x="36" y="66" font-size="13">One <tspan class="mono">item.created</tspan> event fans out to two subscribers: the activity feed (sync) and the search index (async job).</text>

  <!-- Controller -->
  <rect class="card" x="36" y="232" width="150" height="76" rx="12"/>
  <text class="t" x="111" y="262" font-size="13" font-weight="700" text-anchor="middle">Controller</text>
  <text class="sub mono" x="111" y="281" font-size="10" text-anchor="middle">POST …/items</text>
  <text class="sub" x="111" y="296" font-size="10" text-anchor="middle">→ call action</text>

  <!-- CreateManual -->
  <rect class="accent" x="216" y="140" width="306" height="260" rx="14"/>
  <text class="sage mono" x="236" y="170" font-size="14" font-weight="700">Items::CreateManual</text>
  <g font-size="12">
    <text class="t" x="236" y="202">① <tspan class="mono">ensure_writable(box.move)</tspan></text>
    <text class="t" x="236" y="232">② resolve category + tags</text>
    <text class="sub" x="252" y="249" font-size="11">from the Move vocabulary (find-or-create)</text>
    <text class="t" x="236" y="279">③ persist item + tags</text>
    <text class="sub" x="252" y="296" font-size="11">one DB transaction · with_responsible</text>
    <text class="t" x="236" y="326">④ emit_event</text>
    <text class="sage mono" x="252" y="344" font-size="11.5">notify("item.created")</text>
    <text class="sub" x="236" y="378" font-size="11">⇒ <tspan class="sage mono">Success(item)</tspan> back to the controller</text>
  </g>

  <!-- bus -->
  <rect class="bus" x="556" y="140" width="62" height="260" rx="14"/>
  <text class="sage" x="587" y="270" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 587 270)">Rails.event</text>

  <!-- consumer A: activity (sync) -->
  <rect class="card" x="668" y="168" width="276" height="80" rx="12"/>
  <text class="t" x="686" y="194" font-size="13" font-weight="700">Activity::RecordSubscriber</text>
  <text class="sub" x="686" y="214" font-size="11">creates the feed row, in-request</text>
  <text class="sage mono" x="686" y="234" font-size="11">“Ada added Coffee Maker”</text>
  <rect class="pill" x="876" y="176" width="56" height="20" rx="10"/>
  <text class="sage" x="904" y="190" font-size="10" font-weight="700" text-anchor="middle">sync</text>

  <!-- consumer B: search (sync emit → async job) -->
  <rect class="card" x="668" y="300" width="276" height="80" rx="12"/>
  <text class="t" x="686" y="326" font-size="13" font-weight="700">Search::IndexSubscriber</text>
  <text class="sub" x="686" y="346" font-size="11">enqueues a reindex (captures tenant)</text>
  <text class="sub mono" x="686" y="365" font-size="10.5">perform_later(item_id, tenant:)</text>

  <!-- async job -->
  <rect class="async" x="990" y="300" width="150" height="80" rx="12"/>
  <text class="t" x="1065" y="326" font-size="12" font-weight="700" text-anchor="middle">RefreshDocumentJob</text>
  <rect class="pill" x="1041" y="338" width="48" height="20" rx="10" fill="#3a2a26" stroke="#ffb59b"/>
  <text class="terra" x="1065" y="352" font-size="10" font-weight="700" text-anchor="middle">async</text>
  <text class="sub" x="1065" y="372" font-size="10" text-anchor="middle">Solid Queue</text>

  <!-- projection -->
  <rect class="card" x="990" y="412" width="150" height="78" rx="12"/>
  <text class="t" x="1065" y="438" font-size="12" font-weight="700" text-anchor="middle">Item search doc</text>
  <text class="sub mono" x="1065" y="457" font-size="9.5" text-anchor="middle">search_text · tsvector</text>
  <text class="sub mono" x="1065" y="472" font-size="9.5" text-anchor="middle">· embedding</text>

  <!-- edges -->
  <path class="edge" d="M186,270 C198,270 200,250 214,232" marker-end="url(#a)"/>
  <path class="edge" d="M522,340 C540,340 540,300 554,290" marker-end="url(#a)"/>
  <path class="edge" d="M618,240 C642,240 648,208 666,208" marker-end="url(#a)"/>
  <path class="edge" d="M618,300 C642,300 648,338 666,338" marker-end="url(#a)"/>
  <path class="edge" d="M944,340 H988" marker-end="url(#a)"/>
  <path class="edge" d="M1065,380 V410" marker-end="url(#a)"/>

  <text class="sub" x="36" y="466" font-size="11.5">Subscribers are wired in <tspan class="mono">config/initializers/</tspan></text>
  <text class="sub" x="36" y="486" font-size="11.5">(<tspan class="mono">activity_log.rb</tspan>, <tspan class="mono">search_indexing.rb</tspan>). The action emits; it never calls a subscriber directly.</text>
</svg>
