<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg{fill:#2A2822}
    .ok{fill:#34312A;stroke:#9FB089;stroke-width:1.6}
    .term{fill:#2f3a2a;stroke:#9FB089;stroke-width:1.6}
    .fail{fill:#3a2a26;stroke:#ffb59b;stroke-width:1.6}
    .t{fill:#ECE7DC}
    .sub{fill:#aeb2a6}
    .sage{fill:#9FB089}
    .terra{fill:#ffb59b}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .rail{stroke:#9FB089;stroke-width:2;fill:none}
    .drop{stroke:#ffb59b;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9FB089"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#ffb59b"/></marker>
  </defs>

  <rect class="bg" width="1080" height="470"/>
  <text class="t" x="36" y="42" font-size="22" font-weight="700">The railway — <tspan class="mono" font-size="20">Success</tspan> / <tspan class="mono" font-size="20">Failure</tspan></text>
  <text class="sub" x="36" y="66" font-size="13"><tspan class="mono">yield</tspan> unwraps a <tspan class="sage">Success</tspan> and passes it on; the first <tspan class="terra">Failure</tspan> short-circuits — later steps never run.</text>

  <!-- success rail line -->
  <line class="rail" x1="36" y1="170" x2="1044" y2="170" opacity="0.35"/>

  <!-- success stations -->
  <g font-size="12.5" font-weight="600" text-anchor="middle">
    <rect class="ok" x="32" y="142" width="130" height="56" rx="12"/>
    <text class="t mono" x="97" y="175" font-size="12.5">call(…)</text>

    <rect class="ok" x="198" y="142" width="164" height="56" rx="12"/>
    <text class="t mono" x="280" y="170" font-size="11.5">ensure_writable</text>
    <text class="sub" x="280" y="186" font-size="10">archived ⇒ guard</text>

    <rect class="ok" x="398" y="142" width="120" height="56" rx="12"/>
    <text class="t mono" x="458" y="170" font-size="11.5">validate</text>
    <text class="sub" x="458" y="186" font-size="10">business rules</text>

    <rect class="ok" x="554" y="142" width="120" height="56" rx="12"/>
    <text class="t mono" x="614" y="170" font-size="11.5">persist</text>
    <text class="sub" x="614" y="186" font-size="10">DB txn</text>

    <rect class="ok" x="710" y="142" width="140" height="56" rx="12"/>
    <text class="t mono" x="780" y="170" font-size="11.5">emit_event</text>
    <text class="sub" x="780" y="186" font-size="10">notify(…)</text>

    <rect class="term" x="886" y="142" width="166" height="56" rx="12"/>
    <text class="sage mono" x="969" y="170" font-size="12.5">Success(record)</text>
    <text class="sub" x="969" y="186" font-size="10">→ controller renders</text>
  </g>

  <!-- success arrows -->
  <g>
    <path class="rail" d="M162,170 H194" marker-end="url(#a)"/>
    <path class="rail" d="M362,170 H394" marker-end="url(#a)"/>
    <path class="rail" d="M518,170 H550" marker-end="url(#a)"/>
    <path class="rail" d="M674,170 H706" marker-end="url(#a)"/>
    <path class="rail" d="M850,170 H882" marker-end="url(#a)"/>
  </g>

  <!-- failure rail -->
  <rect class="fail" x="198" y="330" width="652" height="58" rx="14"/>
  <text class="terra" x="218" y="356" font-size="13" font-weight="700">Failure</text>
  <text class="t mono" x="218" y="375" font-size="11.5">Failure(:move_archived) · Failure(:room_required) · Failure(record.errors)</text>

  <!-- drop arrows -->
  <path class="drop" d="M280,198 V326" marker-end="url(#r)"/>
  <path class="drop" d="M458,198 V326" marker-end="url(#r)"/>
  <path class="drop" d="M614,198 V326" marker-end="url(#r)"/>

  <!-- failure outcome -->
  <path class="drop" d="M850,359 H882" marker-end="url(#r)"/>
  <rect class="fail" x="886" y="330" width="166" height="58" rx="14"/>
  <text class="t mono" x="969" y="356" font-size="11" text-anchor="middle">in Failure(reason)</text>
  <text class="sub" x="969" y="374" font-size="10" text-anchor="middle">→ 422 / alert redirect</text>

  <text class="sub" x="36" y="432" font-size="11.5">Controllers pattern-match the result: <tspan class="mono" fill="#ECE7DC">case result in Success(x) … in Failure(:reason) … in Failure(errors) …</tspan></text>
  <text class="sub" x="36" y="452" font-size="11.5">Base: <tspan class="mono" fill="#ECE7DC">class BaseAction; include Dry::Monads[:result, :do]; end</tspan> — see app/actions/base_action.rb</text>
</svg>
