gemfile: false
verify_signatures: false

PreCommit:
  BundleCheck:
    enabled: true

  ErbLint:
    enabled: true
    required_executable: bundle
    command: ["bundle", "exec", "erb_lint"]
    include: "**/*.html.erb"

  FixMe:
    enabled: true
    keywords: ["FIXME"]
    exclude:
      - .overcommit.yml

  LocalPathsInGemfile:
    enabled: true

  RailsSchemaUpToDate:
    enabled: true

  Packwerk:
    enabled: true
    required_executable: bundle
    description: "Checking Packwerk domain boundaries"
    include:
      - "app/**/*.rb"
      - "packs/**/*.rb"

  RuboCop:
    enabled: true
    required_executable: bundle
    command: ["bundle", "exec", "rubocop"]
    on_warn: fail

  Steep:
    enabled: true
    required_executable: bundle
    description: "Type-checking the actions + model layers with Steep"
    include:
      - "app/actions/**/*.rb"
      - "app/models/**/*.rb"
      # All packs on purpose (not just Steepfile-checked ones): an unchecked
      # pack's file triggers a harmless green whole-target run (~6s), and a
      # pack added to the Steepfile later needs no hook edit.
      - "packs/*/app/actions/**/*.rb"
      - "packs/*/app/models/**/*.rb"
      - "packs/*/app/public/**/*.rb"
      - "sig/**/*.rbs"
      - "rbs_collection.yaml"
      - "Steepfile"

  TrailingWhitespace:
    enabled: true
    exclude:
      - "**/db/structure.sql"

CommitMsg:
  ForbidSkipMarkers:
    enabled: true
    description: "Check for CI/deploy skip markers"
    requires_files: false

PostCheckout:
  ALL:
    quiet: false
