gemfile: false
verify_signatures: false

PreCommit:
  BundleCheck:
    enabled: true

  ErbLint:
    enabled: true
    required_executable: bundle
    command: ["bundle", "exec", "erb_lint"]
    include: "**/*.html.erb"

  FixMe:
    enabled: true
    keywords: ["FIXME"]
    exclude:
      - .overcommit.yml

  LocalPathsInGemfile:
    enabled: true

  RailsSchemaUpToDate:
    enabled: true

  RuboCop:
    enabled: true
    required_executable: bundle
    command: ["bundle", "exec", "rubocop"]
    on_warn: fail

  TrailingWhitespace:
    enabled: true
    exclude:
      - "**/db/structure.sql"

CommitMsg:
  ForbidSkipMarkers:
    enabled: true
    description: "Check for CI/deploy skip markers"
    requires_files: false

PostCheckout:
  ALL:
    quiet: false
