# E1 — Label Print (range) strings. No customer-facing copy is hard-coded in the
# Phlex view; everything renders through label_print.*.
en:
  label_print:
    title: "Print Labels"
    subtitle: "Print exterior labels for a range of boxes in one PDF (%{copies} per box)."
    empty_state: "This move has no boxes yet. Add a box to print its label."
    range_hint: "Boxes %{min}–%{max} · %{count} boxes"
    from: "From box #"
    to: "To box #"
    submit: "Print labels"
    confirm:
      title: "Print %{labels} labels?"
      body: "That's %{boxes} boxes × %{copies} per box — a lot of thermal paper. Print anyway, or go back and narrow the range."
      submit: "Print anyway"
      cancel: "Back"
    errors:
      invalid_range: "Enter a valid range — the first box number must be less than or equal to the last."
      empty: "No boxes found in that range."
      too_many: "Too many labels at once — at %{max} boxes max for this per-box setting. Narrow the range or lower labels per box."
    run:
      title: "Generating labels"
      subtitle: "Boxes %{from}–%{to} · %{count} boxes"
      back: "Back to Print Labels"
    status:
      progress_label: "Generating"
      in_progress: "Generating %{done} of %{total} boxes…"
      ready_title: "Your labels are ready."
      download: "Download PDF"
      failed_title: "Label generation failed."
      retry: "Try again"
