# A1 — Create / select Move strings (Phase D1). No customer-facing copy is
# hard-coded in the Phlex components; everything renders through moves.*.
en:
  moves:
    # Shared archived (read-only) flash for mutating controller actions
    # (MoveScopedController#require_writable_move!). Distinct from moves.read_only
    # below (a short status label) — duplicate keys would collide in YAML.
    archived_alert: "This move is archived and is read-only."
    index:
      title: "Your moves"
      subtitle: "Select a destination to continue organizing."
      create: "Create a move"
    empty:
      title: "Ready to start moving?"
      description: "You don't have any active moves in this organization yet."
      create: "Create your first move"
    new:
      title: "New journey"
      subtitle: "Set up your moving details to stay organized and mindful."
      back: "Back to moves"
    form:
      name: "Move name"
      name_placeholder: "e.g. Dream Apartment 2024"
      planned_on: "Planned date"
      origin: "Origin address"
      destination: "Destination address"
      unit_system: "Unit system"
      optional: "Optional"
      submit: "Create move"
      errors:
        one: "1 error prevented this move from being saved:"
        other: "%{count} errors prevented this move from being saved:"
    unit:
      metric: "Metric"
      imperial: "Imperial"
    status:
      planned: "Planned"
      started: "Started"
      finished: "Finished"
      archived: "Archived"
    packed_hint: "%{packed} of %{total} boxes packed"
    pending_review:
      zero: "No pending review"
      one: "1 pending review"
      other: "%{count} pending review"
    read_only: "Archived — read only"
    # A curated sample Move auto-provisioned for a brand-new account (#432) so the
    # app is populated to explore from the first screen, with a one-tap remove.
    sample:
      badge: "Sample"
      preparing: "Setting up a sample move you can explore…"
      failed_title: "Couldn't set up your sample move"
      failed_body: "No problem — create your own move to get started."
      remove: "Remove sample move"
      remove_confirm: "Remove this sample move and all its boxes, items and photos? This can't be undone."
    create:
      created: "%{name} was created."
    destroy:
      destroyed: "%{name} was removed."
      destroy_failed: "Couldn't remove that move. Please try again."
