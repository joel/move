# Move-wide review queue (#654) — photos still holding unreviewed items, plus
# the "Review all" cross-box walk entry. No customer-facing copy is hard-coded
# in the Phlex views; everything renders through review_queues.*.
en:
  review_queues:
    show:
      title: "Review"
      subtitle: "Photos with items still to check, newest first."
      review_all: "Review all"
      box_label: "Box %{number}"
      pending_badge:
        one: "1 item"
        other: "%{count} items"
      capped: "Showing the newest %{count} photos."
      empty:
        caught_up_title: "All caught up"
        caught_up_description: "Every detected item has been reviewed."
        caught_up_leftover:
          one: "No photos left to review. 1 item still pending has no photo to walk — resolve it from its item page."
          other: "No photos left to review. %{count} items still pending have no photo to walk — resolve them from their item pages."
        browse_gallery: "Browse the gallery"
        title: "Nothing to review yet"
        description: "Photos you capture while packing will queue here for a quick check."
