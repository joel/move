# D6 — Review flow (C2 review by photo). No customer-facing copy is hard-coded in
# the Phlex views; everything renders through reviews.*.
en:
  reviews:
    photo:
      progress: "Photo %{position} of %{total}"
      badge: "Photo %{position} of %{total}"
      # Queue mode (#654) — the Move-wide walk: no stable total, so progress is
      # the honest remaining count; the badge locates the photo instead ("Box 3").
      queue_badge: "Box %{number}"
      # The queue badge doubles as the jump-to-box link (#684) — the walk's back
      # arrow returns to the queue, so this is the photo's only path to its box.
      view_box: "View box %{number}"
      queue_progress:
        zero: "Last photo to review"
        one: "1 more photo after this"
        other: "%{count} more photos after this"
      # #699 — prev/next walk navigation (pure navigation, distinct from the
      # advance controls): prev reaches marked photos in box mode and
      # still-pending photos in queue mode.
      nav:
        label: "Photo navigation"
        previous: "Previous photo"
        next: "Next photo"
      title: "Review Items"
      subtitle: "We spotted these items. Tap to edit or remove."
      subtitle_touch: "We spotted these items. Tap a name to edit — swipe left to remove."
      view_only: "You have view-only access — reviewing is read-only."
      name: "Item name"
      confidence: "%{percent}% confidence"
      added: "Added"
      edit: "Edit item"
      remove_named: "Remove %{name}"
      swipe_edit: "Edit"
      swipe_remove: "Remove"
      add: "Add item"
      add_placeholder: "Add a missed item…"
      move_heading: "Move this photo to another box"
      move_to_box: "Box #%{number}"
      move_submit: "Move"
      delete_heading: "Delete this photo"
      delete_submit: "Delete photo"
      delete_confirm: "Delete this photo and the items detected in it? You can restore it from the activity feed."
      retake_heading: "Retake this photo"
      retake_submit: "Retake photo"
      retake_rescan: "Also re-scan for items"
      next: "Next Photo"
      finish: "Finish review"
      # Explicit review actions (#660): Mark confirms this photo's items and
      # advances; Ignore advances without changing anything.
      mark_reviewed: "Mark as Reviewed"
      ignore: "Ignore"
      empty_title: "Nothing detected here"
      empty_description: "No items remain to review in this photo."
    flash:
      nothing: "Nothing to review in this box yet."
      photo_marked: "Photo marked as reviewed."
      mark_failed: "Could not mark this photo as reviewed. Try again."
      item_added: "Added “%{name}”."
      add_failed: "Could not add that item — give it a name and try again."
      photo_moved: "Photo moved to box #%{number}."
      photo_deleted: "Photo deleted. Restore it from the activity feed if needed."
      photo_delete_wrong_phase: "Photos can only be deleted while the box is packing — unseal it first."
      photo_delete_failed: "Could not delete the photo. Try again."
      photo_retaken: "Photo replaced."
      retake_errors:
        no_file: "Choose a photo to replace it with."
        recognition_in_flight: "Recognition is still running on this photo — try again in a moment."
        rescan_wrong_phase: "Re-scanning adds items, which is only possible while the box is packing. Replace the photo without re-scanning, or unseal the box first."
        image_too_large: "That image is too large. Try a smaller photo."
        unsupported_image: "That file isn't a supported image. Use a JPEG, PNG, or WEBP."
        failed: "Could not replace the photo. Try again."
      move_photo_errors:
        box_missing: "Pick a box to move the photo to."
        same_box: "The photo is already in that box."
        cross_move: "You can only move a photo within the same move."
        move_archived: "This move is archived and can't be changed."
        failed: "Could not move the photo. Try again."
