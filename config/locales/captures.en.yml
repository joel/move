# B2 — Capture image strings (Phase D4). No customer-facing copy is hard-coded
# in the Phlex components; everything renders through captures.*.
en:
  captures:
    title: "Capture for Box #%{number} — %{room}"
    online: "Online"
    tap_to_capture: "Tap to capture"
    capture_hint: "Ensure items are well lit and clearly visible"
    # In-app viewfinder (#616) — the camera renders inside the portrait-locked
    # app window instead of the native camera app.
    viewfinder:
      allow: "Allow camera access to start capturing"
      shutter: "Take photo"
      library: "Choose from library"
      use_camera: "Use camera"
      unavailable: "Camera unavailable — tap above to choose a photo."
    finish: "Finish box"
    add_item: "Add item manually"
    sealed: "This box is sealed — unseal it before capturing."
    # Shown when the Move's recognition provider is `fake` (the post-cutover
    # default): detections are canned sample data, not real recognition (#199).
    demo_banner: "Demo recognition is on — detected items are sample data, not your photo. Add an API key in Settings for real recognition."
    session:
      title: "Items"
      count:
        zero: "No captures"
        one: "1 capture"
        other: "%{count} captures"
      empty: "Captured images for this box will appear here."
      more: "+%{count} more"
      # A run that succeeded but detected nothing (#856): the card still links
      # to the photo review so missed items can be added by hand.
      no_items: "No items detected — tap to add them"
      # A run whose every detection matched an already-confirmed item (#872): it
      # records conflict suggestions but no new item; the card links to the match.
      conflict_only: "Already in this box — review the match"
      # Secondary link on that card (#891): the photo's own review page, where
      # it can be retaken, re-scanned or deleted.
      manage_photo: "Manage photo"
      ingest_failed: "This photo couldn't be processed. Try capturing it again."
      items_found:
        zero: "No items found"
        one: "1 item found"
        other: "%{count} items found"
    create:
      captured: "Image captured — recognizing items…"
    retry:
      retried: "Recognition retried."
    errors:
      no_file: "Choose an image to capture (you appear to be offline or no file was selected)."
      failed: "That capture could not be saved. Check your connection and try again."
      unsupported_image: "That file isn't a supported image. Use a photo (JPEG, PNG, WEBP, HEIC, or TIFF)."
      image_too_large: "That image is too large (max %{max}). Try a smaller photo."
