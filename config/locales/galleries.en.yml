# Gallery — Move-wide photo browse. No customer-facing copy is hard-coded in the
# Phlex views; everything renders through galleries.*.
en:
  galleries:
    index:
      title: "Gallery"
      subtitle: "Every photo across this move, newest first."
      generated: "Generated"
      box_label: "Box %{number}"
      pager:
        remaining:
          one: "1 more photo"
          other: "%{count} more photos"
        load_more: "Load more"
        loading: "Loading…"
      sort:
        label: "Sort"
        recent: "Newest first"
        oldest: "Oldest first"
      filters:
        all: "All rooms"
        clear: "Clear filter"
      lightbox:
        view_box: "View box"
        prev: "Previous photo"
        next: "Next photo"
        close: "Close"
        zoom: "Zoom photo"
        error: "The photo could not be loaded."
        # Mobile thumbs-gallery (#604): the dialog's accessible name and the
        # "n of total" position counter. The counter is filled in on the client
        # (index/total are per-slide), so it uses {index}/{total} — NOT I18n's
        # %{...} — so I18n never tries to interpolate it here.
        dialog: "Photo viewer"
        counter: "{index} of {total}"
        # Accessible label for an item chip; {name} is filled in on the client
        # per chip, so it uses {name} — NOT I18n's %{...} — like counter above.
        item_search: "Search for “{name}”"
      empty:
        title: "No photos yet"
        description: "Photos you capture while packing boxes will appear here."
        filtered_title: "No photos in this room"
        filtered_description: "Try another room, or clear the filter to see every photo."
    toggle:
      label: "Gallery view"
      photos: "Photos"
      groups: "Groups"
      to_review: "To review"
    groups:
      title: "Groups"
      subtitle: "Related things, grouped — even when they ended up in different boxes."
      capped: "Showing the %{count} most spread-out groups."
      card:
        items:
          one: "%{count} item"
          other: "%{count} items"
        boxes:
          one: "%{count} box"
          other: "%{count} boxes"
        box_chip: "Box %{number}"
        more_boxes: "+%{count}"
      no_items:
        title: "Nothing to group yet"
        description: "Capture a few boxes and your things will start grouping themselves."
      organizing:
        title: "Organizing your items…"
        description: "Related things — batteries, chargers, cables — are being grouped. This takes a few seconds and updates on its own."
      none:
        title: "No groups yet"
        description: "Groups appear when related things end up in different boxes — like batteries in the kitchen box and the office box."
