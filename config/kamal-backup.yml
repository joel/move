# Scheduled encrypted database backups (kamal-backup → restic → Cloudflare R2).
# Runs in the `backup` Kamal accessory (config/deploy.yml); this file is mounted
# read-only into that container. What's covered vs deliberately excluded
# (cache/queue/cable DBs, media #537), ops + restore runbooks: doc/project/backups.md.
app: move
accessory: backup
databases:
  - name: app
    adapter: postgres
    url: postgres://move@move-db:5432/move_production
    password:
      secret: POSTGRES_PASSWORD
restic:
  # The full URL (s3:https://<account-id>.r2.cloudflarestorage.com/move-backups)
  # stays in Doppler: the R2 account id doesn't belong in a public repo.
  repository:
    secret: RESTIC_REPOSITORY
  password:
    secret: RESTIC_PASSWORD
  init_if_missing: true
  # R2 egress is free, so verifying the repository after every backup costs nothing.
  check_after_backup: true
  # Set ALL retention keys explicitly: kamal-backup fills any unset key from its
  # DEFAULT_RETENTION (keep_last 7, keep_yearly 2), which would silently retain
  # data ~2 years past the intended window. Zeroed keys emit no restic flag, so
  # the effective policy is exactly what's documented: 7 daily / 4 weekly / 6 monthly.
  retention:
    keep_last: 0
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
    keep_yearly: 0
backup:
  schedule: 1d
