test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# SeaweedFS — S3-compatible object store backing Active Storage in dev and prod.
# Path-style addressing (force_path_style) + a custom endpoint; dev SeaweedFS
# accepts anonymous access so the keys can be placeholders there, real keys in prod.
seaweedfs:
  service: S3
  # Default to the gateway's container DNS on the shared network (reachable from
  # the app container in dev and prod). storage.move-easy.docker is the Web
  # UI host (Traefik :8888), not the S3 API — don't default to it.
  endpoint: <%= ENV.fetch("STORAGE_ENDPOINT", "http://seaweedfs:8333") %>
  bucket: <%= ENV.fetch("STORAGE_BUCKET", "move") %>
  region: <%= ENV.fetch("STORAGE_REGION", "us-east-1") %>
  access_key_id: <%= ENV.fetch("STORAGE_ACCESS_KEY_ID", "move-dev") %>
  secret_access_key: <%= ENV.fetch("STORAGE_SECRET_ACCESS_KEY", "move-dev-secret") %>
  force_path_style: true

# Cloudflare R2 — S3-compatible, OFF-BOX, ~11-nines durable object store backing
# Active Storage in PRODUCTION (media migrated off the on-box SeaweedFS so a VM
# resize can never corrupt it again — #567 / resolves #537). Same `service: S3`
# block as seaweedfs; R2 is S3-compatible with a custom account endpoint + path
# style. The endpoint carries the account id, so it lives in Doppler (R2_ENDPOINT),
# not the repo. Dev/test never select this service (they stay on seaweedfs/Disk),
# so the placeholder defaults below are only there to keep YAML parsing happy.
r2:
  service: S3
  endpoint: <%= ENV.fetch("R2_ENDPOINT", "https://example.r2.cloudflarestorage.com") %>
  bucket: <%= ENV.fetch("R2_BUCKET", "move-media") %>
  region: <%= ENV.fetch("R2_REGION", "auto") %>
  access_key_id: <%= ENV.fetch("R2_ACCESS_KEY_ID", "move-dev") %>
  secret_access_key: <%= ENV.fetch("R2_SECRET_ACCESS_KEY", "move-dev-secret") %>
  force_path_style: true

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

