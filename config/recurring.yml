production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_abandoned_uploads:
    class: PurgeAbandonedUploadsJob
    schedule: every day at 4am
  purge_stale_label_print_runs:
    class: PurgeStaleLabelPrintRunsJob
    schedule: every day at 4am
  purge_stale_insurance_dossier_runs:
    class: PurgeStaleInsuranceDossierRunsJob
    schedule: every day at 4am
  purge_stale_session_handoff_tokens:
    class: PurgeStaleSessionHandoffTokensJob
    schedule: every day at 4am
  purge_stale_move_invitations:
    class: PurgeStaleMoveInvitationsJob
    schedule: every day at 4am
  purge_expired_discards:
    class: PurgeExpiredDiscardsJob
    schedule: every day at 4am
