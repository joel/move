# Name of your application. Used to uniquely configure containers.
service: move

# Name of the container image.
image: joelazemar/move

# Deploy to these servers.
# SSH target = the raw origin IP, not a Cloudflare-proxied hostname (proxied
# records resolve to Cloudflare IPs, which do not accept SSH). Confirm this is
# the server's real IP with port 22 reachable.
servers:
  web:
    - 65.20.110.89
  # job:
  #   hosts:
  #     - workeverywhere.app
  #   cmd: bin/jobs

# kamal-proxy serves a custom WILDCARD certificate (a Cloudflare Origin CA cert
# covering move-easy.org + *.move-easy.org), supplied via secrets. Let's Encrypt
# is not used: it cannot issue wildcards over HTTP-01, and tenant subdomains are
# dynamic. With no `host:`, the proxy forwards EVERY host (apex + *.move-easy.org)
# to the app; the MoveTenantElevator resolves the tenant from the subdomain.
# Cloudflare must be set to SSL/TLS mode "Full (Strict)".
proxy:
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM
  # Behind Cloudflare: trust its X-Forwarded-* (real client IP / proto). Pair
  # with an origin firewall locked to Cloudflare IP ranges to prevent spoofing.
  forward_headers: true

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  # server: registry.digitalocean.com / ghcr.io / ...
  username: joelazemar

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - NOTIF_MAIL_USERNAME
    - NOTIF_MAIL_PASSWORD
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true
    NOTIF_MAIL_HOST: mail.smtp2go.com
    NOTIF_MAIL_PORT: 587
    NOTIF_MAIL_FROM: move@joelazemar.com

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use move-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2
    DB_HOST: move-db
    DB_PORT: 5432
    POSTGRES_USER: move

    # WebAuthn passkeys must bind to the registrable parent domain, not the
    # specific subdomain, so a passkey works on the apex and every org subdomain.
    WEBAUTHN_RP_ID: move-easy.org

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "move_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: x86_64

  # Disable buildx provenance/SBOM attestations: Docker Hub rejects the
  # attestation manifest's blobs ("blob unknown to registry") on push.
  provenance: false

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.2
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
ssh:
  user: deploy

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:18
    # SSH target = raw origin IP (see servers.web note).
    host: 65.20.110.89
    env:
      clear:
        POSTGRES_DB: move_production
        POSTGRES_USER: move
      secret:
        - POSTGRES_PASSWORD

    # Data directory on the host
    directories:
      - data:/var/lib/postgresql

    # Healthcheck: these become --health-cmd, --health-interval, etc.
    options:
      health-cmd: "pg_isready -U move -d move_production || exit 1"
      health-interval: 5s
      health-timeout: 3s
      health-retries: 10
