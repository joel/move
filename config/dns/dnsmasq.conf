# Local dev DNS for the move-easy.docker zone. Every name under it (and the
# apex) answers A 127.0.0.2: Move's edge loopback IP, so it never collides with
# the ISMS stack on 127.0.0.1. Keep in sync with AppCLI::Services::Edge::IP.
address=/move-easy.docker/127.0.0.2

# Authoritative for the zone: unserved types (AAAA) get NODATA, not REFUSED, so
# browsers never chase ::1 and BusyBox nslookup (the start probe) succeeds.
local=/move-easy.docker/

# No upstreams, ever: every query outside the zone is refused, so this can
# never act as an open resolver.
no-resolv
no-poll
no-hosts

port=53
