inherit_from: .rubocop_todo.yml

require:
  - ./lib/rubocop/move

plugins:
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-rspec_rails
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake

inherit_mode:
  merge:
    - Include

AllCops:
  DisplayCopNames: true
  DisplayStyleGuide: true
  NewCops: enable
  Exclude:
    # ignore bin/* except for bin/setup
    - !ruby/regexp //home/joel/Workspace/Rails/templates/core\-templates/templates/root/templates/bin\/(?!setup).*/
    - .git/**/*
    - db/**/*
    - log/**/*
    - public/**/*
    - storage/**/*
    - tmp/**/*
    - vendor/**/*
    - 'spec/spec_helper.rb'
    - 'lib/templates/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Exclude:
    - config/**/*
    - spec/**/*
    - Gemfile
    - Rakefile
    - Thorfile
    - bin/**/*
    - config.ru
    - db/**/*
    - lib/tasks/**/*

Metrics/ParameterLists:
  # Phlex component initializers expose their public API as keyword arguments;
  # counting each optional keyword as a parameter penalises clear, composable
  # components. Keep the positional limit, ignore keyword args.
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - config/**/*
    - spec/**/*

Metrics/ClassLength:
  Exclude:
    - spec/**/*

Metrics/MethodLength:
  Exclude:
    - db/migrate/*
    - spec/**/*

Metrics/ModuleLength:
  Exclude:
    - config/**/*

Rails/ApplicationRecord:
  Exclude:
    - db/migrate/**

Style/Documentation:
  Enabled: false

# --- Project custom cops (lib/rubocop/cop/move) -----------------------------
# Encode recurring standards so the pre-commit hook + CI enforce them, instead of
# relying on review/memory (see AGENTS.md §1).
Move/BroadRescue:
  Enabled: true
  Exclude:
    - 'spec/**/*'

Move/DatabaseAggregation:
  Enabled: true
  Exclude:
    - 'spec/**/*'