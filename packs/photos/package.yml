# packs/photos — photo (Media)-level actions: move, delete, restore.
#   PUBLIC (sigil): Photos::Move (ReviewsController), Photos::Delete (ReviewsController),
#   Photos::Restore (ActivitiesController). (Retake lives in packs/captures — it reuses
#   the capture ingest: ImageNormalizer + recognition.)
# dependencies: ['.'] (BaseAction + Media/Box are root). visible_to: ['.'].
enforce_dependencies: true
enforce_privacy: true
enforce_visibility: true
enforce_architecture: true
layer: domain
dependencies:
  - "."
visible_to:
  - "."
