# packs/recognition — the AI recognition pipeline: runs, suggestions, and the
# per-Move provider adapters that turn a captured photo into detected objects.
#
#   PUBLIC API (# pack_public sigil, kept in-layer):
#     RecognitionRuns::Enqueue   enqueue a run (Captures::Create calls it)
#     RecognitionRuns::Retry     retry a run (captures + recoveries controllers)
#     RecognitionProviders       per-Move registry (.for_move / .default_model —
#                                Boxes::SuggestDescription, Moves::SetRecognitionProvider,
#                                the settings panel view)
#   PUBLIC (app/public):
#     RecognitionRun, RecognitionSuggestion — named in Moves::Destroy::DELETE_ORDER,
#                                referenced by BoxesController + the captures subscriber.
#   PRIVATE (internal to recognition):
#     RecognitionRuns::Process + ProcessJob (the run executor),
#     RecognitionProviders::{Base,Anthropic,Fake,Gemini,Openai,Result,DetectedObject}
#       — reached only via RecognitionProviders.for_move inside this pack.
#
# dependencies: ['.', 'packs/utility'] — subclasses BaseAction and references root
#   domain models (Item/Media/Box/Move), plus ApplicationRecord (models) + ProviderHttp
#   (provider adapters) from the kernel. visible_to: ['.'] — every consumer (captures,
#   boxes, moves, controllers, the settings view) is still in the root.

enforce_dependencies: true
enforce_privacy: true
enforce_visibility: true
enforce_architecture: true

layer: domain

dependencies:
  - "."
  - "packs/utility"
  - "packs/captures"

visible_to:
  - "."
  - "packs/captures"
