# packs/captures — the capture-and-recognition pipeline (one bounded context).
#
# Captures and recognition are folded into a single pack because their aggregate
# roots are bidirectionally coupled at the data-model level: Media `has_many
# :recognition_runs, dependent: :destroy` (Media owns the runs) and RecognitionRun
# `belongs_to :media`. That is an irreducible dependency cycle for two separate
# packs (Packwerk's acyclic rule surfaced it), so they belong together — a captured
# photo and its AI recognition are one lifecycle.
#
#   PUBLIC (app/public): Media, RecognitionRun, RecognitionSuggestion.
#   PUBLIC (sigil): Captures::Create, Captures::SessionContent, RecognitionRuns::
#     Enqueue, RecognitionRuns::Retry, RecognitionProviders, MediaVariants::
#     TransformUrl (the display-URL builder the root views/components call).
#   PRIVATE: ImageNormalizer, MediaVariants::Prewarm(+Job), RecognitionRuns::Process
#     (+Job), the provider adapters, and the capture/prewarm subscribers.
#
# dependencies: ['.', 'packs/utility']. visible_to: root + packs/accounts (which
# references Media). Recognition's own constants are referenced only from the root.
enforce_dependencies: true
enforce_privacy: true
enforce_visibility: true
enforce_architecture: true
layer: domain
dependencies:
  - "."
  - "packs/utility"
visible_to:
  - "."
  - "packs/accounts"
