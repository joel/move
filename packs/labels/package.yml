# packs/labels — bulk box-label printing (the async LabelPrintRun lifecycle).
#
# This is the first fully-bounded domain pack and the template for the rest. All
# four boundary axes are enforced:
#
#   enforce_dependencies  — may only reference packs listed in `dependencies`.
#   enforce_privacy       — only constants under app/public/ are referenceable from
#                           outside; everything else (the actions/job internals) is
#                           private to this pack.
#   enforce_visibility    — only packs listed in `visible_to` may depend on labels.
#   enforce_architecture  — as a `domain` pack it may reference `domain`/`utility`
#                           (and the unlayered root), never the `application` layer.
#
# PUBLIC API (app/public/):
#   LabelPrintRun           — the run record (referenced by Accounts::Delete,
#                             Moves::Destroy, PurgeStaleLabelPrintRunsJob).
#   LabelPrintRuns::Start   — the entry-point action (referenced by the controller).
# PRIVATE (app/actions, app/jobs):
#   LabelPrintRuns::{RecordProgress, Broadcasting, GenerateJob}.
#
# Dependencies: `packs/utility` for the kernel framework bases (ApplicationRecord,
# ApplicationJob, …) and `.` (root) for everything still there — both the domain
# constants (Move, Box, BoxLabelsPdf) AND BaseAction (which stays in root until its
# Move-coupled ensure_writable is decoupled, #443; LabelPrintRuns::* subclass it).
# As more domains are extracted, swap '.' for the specific packs — but keep '.'
# while BaseAction lives there. `visible_to: ['.']` — only the root app references
# labels today; when accounts/moves become their own packs, add them here.

enforce_dependencies: true
enforce_privacy: true
enforce_visibility: true
enforce_architecture: true

layer: domain

dependencies:
  - "."
  - "packs/utility"

visible_to:
  - "."
  - "packs/accounts"
